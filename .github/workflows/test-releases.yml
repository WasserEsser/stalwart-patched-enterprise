name: Test Stalwart releases

on:
  schedule:
    # Check daily at 2am UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      stalwart_tag:
        description: 'stalwartlabs/stalwart (0.12.x+) tag to test, e.g. v0.16.23'
        required: false
        default: ''
      mail_server_tag:
        description: 'stalwartlabs/mail-server (0.9.x-0.11.x) tag to test, e.g. v0.11.8'
        required: false
        default: ''
  pull_request:

# Cancel superseded runs of the same kind (newer PR push, newer nightly)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'nightly' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # binary inside the image | container user | patch-check mode
  VARIANT_NEW: '/usr/local/bin/stalwart|stalwart|json'
  VARIANT_OLD: '/usr/local/bin/stalwart-mail|root|toml'

jobs:
  # Nightly and manual runs. The embedded public key is identical in every
  # release from 0.9.0 on, so testing every version is pointless: the newest tag
  # of each product line is what could introduce a new key or a new layout. The
  # oldest tag of each line is kept as a cheap canary for re-tagged images.
  check-and-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Generate a signing key pair
        id: keys
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/signing.key"
          PUB=$(./generate-license.sh --pubkey-only --key "$KEY" --quiet)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "pub=$PUB"  >> "$GITHUB_OUTPUT"

      - name: Discover Stalwart tags
        id: discover
        env:
          MANUAL_NEW: ${{ inputs.stalwart_tag }}
          MANUAL_OLD: ${{ inputs.mail_server_tag }}
        run: |
          set -euo pipefail

          # repo | tag | binary | user | mode
          if [ -n "$MANUAL_NEW" ]; then
            echo "stalwartlabs/stalwart|$MANUAL_NEW|/usr/local/bin/stalwart|stalwart|json"
          fi
          if [ -n "$MANUAL_OLD" ]; then
            echo "stalwartlabs/mail-server|$MANUAL_OLD|/usr/local/bin/stalwart-mail|root|toml"
          fi
          if [ -n "$MANUAL_NEW" ] || [ -n "$MANUAL_OLD" ]; then
            exit 0
          fi

          python3 - <<'PY'
          import json, re, sys, urllib.request

          # repo, binary, container user, patch-check mode
          REPOS = [
              ("stalwartlabs/stalwart",    "/usr/local/bin/stalwart",      "stalwart", "json"),
              ("stalwartlabs/mail-server", "/usr/local/bin/stalwart-mail", "root",     "toml"),
          ]

          def version(tag):
              return tuple(int(x) for x in re.findall(r"\d+", tag))

          for repo, binary, user, mode in REPOS:
              url = f"https://hub.docker.com/v2/repositories/{repo}/tags?page_size=100"
              try:
                  with urllib.request.urlopen(url, timeout=60) as fh:
                      data = json.load(fh)
              except Exception as exc:                      # network hiccup: skip repo
                  print(f"WARN: cannot list {repo} tags: {exc}", file=sys.stderr)
                  continue

              tags = [r.get("name", "") for r in data.get("results", [])]
              tags = [t for t in tags if re.fullmatch(r"v?\d+\.\d+\.\d+", t)]
              # 0.3.0 - 0.8.5 predate the enterprise licensing code entirely
              # (no license.rs), so there is no public key to replace.
              tags = [t for t in tags if version(t) >= (0, 9, 0)]
              tags.sort(key=version, reverse=True)
              if not tags:
                  continue

              for t in (tags[0], tags[-1]):
                  print(f"{repo}|{t}|{binary}|{user}|{mode}")
          PY

      - name: Build and check each tag
        if: steps.discover.outputs.new_tags != ''
        env:
          PUB: ${{ steps.keys.outputs.pub }}
          KEY: ${{ steps.keys.outputs.key }}
        run: |
          set -uo pipefail
          mapfile -t TAGS <<< "${{ steps.discover.outputs.new_tags }}"

          OK=""; FAILED=""

          for ENTRY in "${TAGS[@]}"; do
            [ -z "$ENTRY" ] && continue
            IFS='|' read -r REPO TAG BINARY USER MODE <<< "$ENTRY"
            LOCAL="sw-test:${REPO##*/}-${TAG}"
            echo "=== ${REPO}:${TAG} (binary=${BINARY}, user=${USER}, mode=${MODE}) ==="

            if ! docker build \
                   --build-arg LICENSE_PUBKEY="${PUB}" \
                   --build-arg STALWART_IMAGE="${REPO}:${TAG}" \
                   --build-arg STALWART_BINARY="${BINARY}" \
                   --build-arg STALWART_USER="${USER}" \
                   -t "${LOCAL}" . ; then
              # patch.sh reports exit 7 when it finds no licence public key at
              # all, which is the honest answer for a build without the
              # enterprise code (or if upstream changed how the key is stored).
              FAILED="${FAILED}${FAILED:+, }${REPO}:${TAG} (patch.sh did not apply)"
              continue
            fi

            # The original image is passed as the control: the same license must
            # be rejected there, otherwise the acceptance check would be vacuous.
            if bash .github/patch-check.sh "${LOCAL}" "${BINARY}" "${MODE}" \
                   "${REPO}:${TAG}" "${KEY}"; then
              OK="${OK}${OK:+, }${REPO}:${TAG}"
            else
              FAILED="${FAILED}${FAILED:+, }${REPO}:${TAG}"
            fi
          done

          echo "ok=${OK}"         >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"

          echo "checked ok: ${OK:-none}"
          echo "FAILED:     ${FAILED:-none}"
          [ -z "$FAILED" ] || exit 1

  # Pull requests: patch and check both product lines, and assert that the
  # patched 0.11.x server accepts a license signed with the matching key at
  # runtime (its key lives in a plain TOML config, so the flow is scriptable).
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Generate a signing key pair
        id: keys
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/signing.key"
          PUB=$(./generate-license.sh --pubkey-only --key "$KEY" --quiet)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "pub=$PUB"  >> "$GITHUB_OUTPUT"

      - name: Build and check the 0.16.x image
        env:
          PUB: ${{ steps.keys.outputs.pub }}
          KEY: ${{ steps.keys.outputs.key }}
        run: |
          set -euo pipefail
          IFS='|' read -r BINARY USER MODE <<< "$VARIANT_NEW"
          docker build --build-arg LICENSE_PUBKEY="${PUB}" \
            --build-arg STALWART_IMAGE="stalwartlabs/stalwart:v0.16.23" \
            --build-arg STALWART_BINARY="${BINARY}" \
            --build-arg STALWART_USER="${USER}" -t sw-test:pr016 . >/dev/null
          bash .github/patch-check.sh sw-test:pr016 "${BINARY}" "${MODE}" "" "${KEY}"

      - name: Build and check the 0.11.x image (includes runtime license check)
        env:
          PUB: ${{ steps.keys.outputs.pub }}
          KEY: ${{ steps.keys.outputs.key }}
        run: |
          set -euo pipefail
          IFS='|' read -r BINARY USER MODE <<< "$VARIANT_OLD"
          docker build --build-arg LICENSE_PUBKEY="${PUB}" \
            --build-arg STALWART_IMAGE="stalwartlabs/mail-server:v0.11.8" \
            --build-arg STALWART_BINARY="${BINARY}" \
            --build-arg STALWART_USER="${USER}" -t sw-test:pr011 . >/dev/null
          bash .github/patch-check.sh sw-test:pr011 "${BINARY}" "${MODE}" \
            "stalwartlabs/mail-server:v0.11.8" "${KEY}"

      - name: Verify the license generator round-trips
        env:
          KEY: ${{ steps.keys.outputs.key }}
        run: |
          set -euo pipefail
          LICENSE=$(./generate-license.sh --domain example.com --accounts 500 --key "${KEY}" --quiet)
          PUB="${{ steps.keys.outputs.pub }}"
          python3 - "$LICENSE" <<'PY'
          import base64, struct, sys, time
          raw = base64.b64decode(sys.argv[1])
          vf, vt, acc, dl = struct.unpack_from('<QQII', raw, 0)
          domain = raw[24:24+dl].decode()
          sig = raw[24+dl:]
          assert domain == 'example.com', domain
          assert acc == 500, acc
          assert vf < vt and vf != 0 and vt != 0, (vf, vt)
          now = int(time.time())
          assert not (now >= vt or now < vf), 'key is already expired'
          assert len(sig) == 64, f'signature is {len(sig)} bytes, expected 64'
          open('/tmp/payload.bin', 'wb').write(raw[:24+dl])
          open('/tmp/sig.bin', 'wb').write(sig)
          print('license layout OK')
          PY
          # The signature must verify against the public key the binary carries.
          openssl pkey -in "${KEY}" -pubout -out /tmp/pub.pem
          openssl pkeyutl -verify -pubin -inkey /tmp/pub.pem -rawin \
            -in /tmp/payload.bin -sigfile /tmp/sig.bin
          echo "license signature verifies"

      - name: Verify a second patch run is idempotent on both binaries
        env:
          PUB: ${{ steps.keys.outputs.pub }}
        run: |
          set -uo pipefail
          IFS='|' read -r B16 _ _ <<< "$VARIANT_NEW"
          IFS='|' read -r B11 _ _ <<< "$VARIANT_OLD"

          check_idem() {
            local image="$1" binary="$2" cid code
            cid=$(docker create "$image" /bin/true)
            docker cp "$cid":"$binary" /tmp/sw-patched
            docker rm "$cid" >/dev/null
            set +e
            bash patch.sh --quiet --pubkey "${PUB}" /tmp/sw-patched
            code=$?
            set -e
            [ "$code" = "6" ] || { echo "ERROR: $binary expected exit 6 (already patched), got $code"; exit 1; }
            echo "idempotency OK: $binary"
          }

          check_idem sw-test:pr016 "$B16"
          check_idem sw-test:pr011 "$B11"
