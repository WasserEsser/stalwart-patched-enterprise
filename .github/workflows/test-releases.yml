name: Test new Stalwart releases

on:
  schedule:
    # Check daily at 2am UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      stalwart_tag:
        description: 'stalwartlabs/stalwart (0.16.x) tag to test, e.g. v0.16.23'
        required: false
        default: ''
      mail_server_tag:
        description: 'stalwartlabs/mail-server (0.11.x) tag to test, e.g. v0.11.8'
        required: false
        default: ''
  pull_request:

# Cancel superseded runs of the same kind (newer PR push, newer nightly)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'nightly' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # repo | binary inside the image | container user | patch-check mode
  VARIANT_016: 'stalwartlabs/stalwart|/usr/local/bin/stalwart|stalwart|json'
  VARIANT_011: 'stalwartlabs/mail-server|/usr/local/bin/stalwart-mail|root|toml'

jobs:
  # Nightly and manual runs: build and check the recent released tags of both
  # product lines.
  check-and-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Discover Stalwart tags
        id: discover
        env:
          MANUAL_016: ${{ inputs.stalwart_tag }}
          MANUAL_011: ${{ inputs.mail_server_tag }}
        run: |
          set -euo pipefail

          if [ -n "$MANUAL_016" ] || [ -n "$MANUAL_011" ]; then
            [ -z "$MANUAL_016" ] || echo "stalwartlabs/stalwart|$MANUAL_016|/usr/local/bin/stalwart|stalwart|json"
            [ -z "$MANUAL_011" ] || echo "stalwartlabs/mail-server|$MANUAL_011|/usr/local/bin/stalwart-mail|root|toml"
            exit 0
          fi

          python3 - <<'PY'
          import json, re, sys, urllib.request

          # repo, binary, container user, patch-check mode
          REPOS = [
              ("stalwartlabs/stalwart",    "/usr/local/bin/stalwart",      "stalwart", "json"),
              ("stalwartlabs/mail-server", "/usr/local/bin/stalwart-mail", "root",     "toml"),
          ]

          for repo, binary, user, mode in REPOS:
              url = f"https://hub.docker.com/v2/repositories/{repo}/tags?page_size=100"
              try:
                  with urllib.request.urlopen(url, timeout=60) as fh:
                      data = json.load(fh)
              except Exception as exc:                      # network hiccup: skip repo
                  print(f"WARN: cannot list {repo} tags: {exc}", file=sys.stderr)
                  continue

              tags = [r.get("name", "") for r in data.get("results", [])]
              tags = [t for t in tags if re.fullmatch(r"v?\d+\.\d+\.\d+", t)]
              tags.sort(key=lambda t: [int(x) for x in re.findall(r"\d+", t)], reverse=True)

              # The pattern table covers every release from 0.9.0 on, so exercise
              # the newest tag of every minor version plus the oldest tag of the
              # line: that hits both ends of every version range in the table.
              seen, picked = set(), []
              for t in tags:
                  minor = ".".join(t.lstrip("v").split(".")[:2])
                  if minor not in seen:
                      seen.add(minor)
                      picked.append(t)
              if tags and tags[-1] not in picked:
                  picked.append(tags[-1])

              for t in picked:
                  print(f"{repo}|{t}|{binary}|{user}|{mode}")
          PY

      - name: Build and check each tag
        if: steps.discover.outputs.new_tags != ''
        run: |
          set -uo pipefail
          mapfile -t TAGS <<< "${{ steps.discover.outputs.new_tags }}"

          OK=""; FAILED=""; UNSUPPORTED=""

          for ENTRY in "${TAGS[@]}"; do
            [ -z "$ENTRY" ] && continue
            IFS='|' read -r REPO TAG BINARY USER MODE <<< "$ENTRY"
            LOCAL="sw-test:${REPO##*/}-${TAG}"
            echo "=== ${REPO}:${TAG} (binary=${BINARY}, user=${USER}, mode=${MODE}) ==="

            if ! docker build \
                   --build-arg STALWART_IMAGE="${REPO}:${TAG}" \
                   --build-arg STALWART_BINARY="${BINARY}" \
                   --build-arg STALWART_USER="${USER}" \
                   -t "${LOCAL}" . ; then
              # The table covers every release from 0.9.0 on, so a failure here
              # means the patch did not match this build - a pattern regression,
              # not "not supported yet".
              echo "Patch did not apply to ${REPO}:${TAG}: no version matched this binary"
              UNSUPPORTED="${UNSUPPORTED}${UNSUPPORTED:+, }${REPO}:${TAG}"
              continue
            fi

            if bash .github/patch-check.sh "${LOCAL}" "${BINARY}" "${MODE}"; then
              OK="${OK}${OK:+, }${REPO}:${TAG}"
            else
              FAILED="${FAILED}${FAILED:+, }${REPO}:${TAG}"
            fi
          done

          echo "ok=${OK}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          echo "unsupported=${UNSUPPORTED}" >> "$GITHUB_OUTPUT"

          echo "checked ok:   ${OK:-none}"
          echo "unsupported:  ${UNSUPPORTED:-none}"
          echo "FAILED:       ${FAILED:-none}"
          [ -z "$FAILED" ] || exit 1

  # Pull requests: patch and check the tag the patterns were derived from, for
  # both product lines. The 0.11.x check additionally asserts that the patched
  # server accepts a generated license key at runtime.
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Build and check the 0.16.x image
        run: |
          set -euo pipefail
          IFS='|' read -r REPO BINARY USER MODE <<< "$VARIANT_016"
          docker build --build-arg STALWART_IMAGE="${REPO}:v0.16.23" \
            --build-arg STALWART_BINARY="${BINARY}" \
            --build-arg STALWART_USER="${USER}" -t sw-test:pr016 .
          bash .github/patch-check.sh sw-test:pr016 "${BINARY}" "${MODE}"

      - name: Build and check the 0.11.x image (includes runtime license check)
        run: |
          set -euo pipefail
          IFS='|' read -r REPO BINARY USER MODE <<< "$VARIANT_011"
          docker build --build-arg STALWART_IMAGE="${REPO}:v0.11.8" \
            --build-arg STALWART_BINARY="${BINARY}" \
            --build-arg STALWART_USER="${USER}" -t sw-test:pr011 .
          bash .github/patch-check.sh sw-test:pr011 "${BINARY}" "${MODE}"

      - name: Verify the license generator still round-trips
        run: |
          set -euo pipefail
          KEY=$(./generate-license.sh --domain example.com --accounts 500 --quiet)
          python3 - "$KEY" <<'PY'
          import base64, struct, sys, time
          raw = base64.b64decode(sys.argv[1])
          vf, vt, acc, dl = struct.unpack_from('<QQII', raw, 0)
          domain = raw[24:24+dl].decode()
          sig = raw[24+dl:]
          assert domain == 'example.com', domain
          assert acc == 500, acc
          assert vf < vt and vf != 0 and vt != 0, (vf, vt)
          now = int(time.time())
          assert not (now >= vt or now < vf), 'key is already expired'
          assert len(sig) > 0, 'empty signature'
          print('license round-trip OK')
          PY

      - name: Verify a second patch run is idempotent on both binaries
        run: |
          set -uo pipefail
          IFS='|' read -r _ B16 _ _ <<< "$VARIANT_016"
          IFS='|' read -r _ B11 _ _ <<< "$VARIANT_011"

          check_idem() {
            local image="$1" binary="$2" cid code
            cid=$(docker create "$image" /bin/true)
            docker cp "$cid":"$binary" /tmp/sw-patched
            docker rm "$cid" >/dev/null
            set +e
            bash patch.sh --quiet /tmp/sw-patched
            code=$?
            set -e
            [ "$code" = "6" ] || { echo "ERROR: $binary expected exit 6 (already patched), got $code"; exit 1; }
            echo "idempotency OK: $binary"
          }

          check_idem sw-test:pr016 "$B16"
          check_idem sw-test:pr011 "$B11"
